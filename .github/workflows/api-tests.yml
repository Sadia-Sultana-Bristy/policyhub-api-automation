name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 1 * * 1-5' # weekdays 01:00 UTC (08:00 Bangkok) — nightly regression
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        type: choice
        default: all
        options: [all, smoke, negative, boundary, db, e2e]

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    env:
      CI: true
      TEST_ENV: local
      BASE_URL: http://localhost:3000
      # In a real project these come from repository secrets:
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-only-secret' }}
      AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD || 'Agent@12345' }}
      VIEWER_PASSWORD: ${{ secrets.VIEWER_PASSWORD || 'Viewer@12345' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: |
          SUITE="${{ github.event.inputs.suite || 'all' }}"
          if [ "$SUITE" = "all" ]; then npx playwright test; else npx playwright test --grep "@$SUITE"; fi

      - name: Publish summary to job page
        if: always()
        run: node utils/reportSummary.js

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports-node${{ matrix.node }}
          path: |
            reports/html
            reports/junit
            reports/json
            reports/summary.md
          retention-days: 14
